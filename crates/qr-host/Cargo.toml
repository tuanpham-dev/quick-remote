[package]
name = "qr-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
qr-proto.workspace = true
qr-fec.workspace = true
qr-net.workspace = true
qr-media.workspace = true
qr-clip.workspace = true
anyhow.workspace = true
rand.workspace = true
bytes.workspace = true
tokio.workspace = true
quinn.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
x11rb = { version = "0.13", features = ["xtest", "randr", "xfixes", "shm", "damage", "xinerama"] }
wtransport = { version = "0.7", default-features = false, features = ["ring", "quinn"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rust-embed = "8"
rcgen.workspace = true
ring = "0.17"
base64 = "0.22"
sha2.workspace = true
qr-pair.workspace = true
rustls.workspace = true
time = "0.3"
png = "0.18"
tokio-tungstenite = "0.30"
futures-util = "0.3"

# The virtual display, Wayland and GNOME desktops, uinput (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
xkbcommon-dl = "0.4"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.17"

[target.'cfg(windows)'.dependencies]
qr-win = { path = "../qr-win" }
windows-service = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }
